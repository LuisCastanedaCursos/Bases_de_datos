<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ER Quest</title><style>
:root{--bg:#07111f;--panel:#0e1c30;--ink:#eef6ff;--muted:#9fb2ca;--cyan:#4de3ff;--violet:#9a7cff;--green:#5df2a6;--red:#ff6b7d;--yellow:#ffd166}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:radial-gradient(circle at 20% 0,#132b49,#07111f 45%);color:var(--ink);min-height:100vh}
header{padding:20px max(18px,4vw);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #20334e;background:#091524}.tag{color:var(--cyan);font-weight:900}h1{margin:3px 0;font-size:clamp(22px,3vw,34px)}
.score{background:#102640;border:1px solid #28476a;padding:10px 14px;border-radius:999px}main{max-width:1050px;margin:auto;padding:24px}.card,.activity{background:linear-gradient(180deg,#0f2036,#0b1829);border:1px solid #203b5b;border-radius:20px;padding:20px;margin-bottom:18px}
.eyebrow{color:var(--cyan);font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.1em}.lead{color:var(--muted);line-height:1.5}
svg{width:100%;height:270px;background:#081421;border-radius:16px;border:1px dashed #31516f}.entity{fill:#15385b;stroke:var(--cyan);stroke-width:3}.attr{fill:#241f4b;stroke:var(--violet);stroke-width:3}.rel{fill:#3a2b13;stroke:var(--yellow);stroke-width:3}.line{stroke:#6687a8;stroke-width:2}svg text{fill:#fff;font-size:15px;font-weight:800;text-anchor:middle;dominant-baseline:middle}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}button{border:0;border-radius:11px;padding:12px 15px;font-weight:850;cursor:pointer;background:var(--cyan);color:#04131e}.choice{background:#152a44;color:white;border:1px solid #36516e}.ok{background:#164932!important;border-color:var(--green)!important}.bad{background:#512330!important;border-color:var(--red)!important}button:disabled{opacity:.45;cursor:not-allowed}
.feedback{min-height:28px;margin-top:10px;font-weight:750}.success{color:var(--green)}.error{color:var(--red)}.statement{padding:13px;background:#11243a;border-left:4px solid var(--yellow);border-radius:10px;line-height:1.5}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.drop{min-height:100px;padding:10px;border:2px dashed #41698e;border-radius:13px}.drop.over{background:#123354;border-color:var(--cyan)}.drop b{display:block;color:var(--cyan);margin-bottom:6px}.tokens{padding:10px;margin-top:10px;min-height:55px;background:#091827;border-radius:12px}.token{display:inline-block;padding:8px 10px;margin:4px;border-radius:9px;background:#1b3554;border:1px solid #4b7197;cursor:grab}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.progress{height:8px;background:#13243a;border-radius:99px;overflow:hidden;margin:15px 0}.bar{height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));transition:.3s}.activity h3{margin:4px 0 8px}.locked{opacity:.5;pointer-events:none}
@media(max-width:700px){.choices,.slots{grid-template-columns:1fr}svg{height:310px}}</style></head><body>
<header><div><div class="tag">ER QUEST</div><h1>Modelo Entidad–Relación</h1></div><div class="score">⭐ <b id="score">0</b> puntos</div></header>
<main>
<div class="card">
<div class="eyebrow" id="level"></div><h2 id="title"></h2><p class="lead" id="desc"></p>
<svg viewBox="0 0 800 270" id="board"></svg>
<p><b id="mainQ"></b></p><div class="choices" id="mainChoices"></div><div class="feedback" id="mainFeedback"></div>
</div>

<div class="activity locked" id="act1"><div class="eyebrow">Actividad independiente 1</div><h3 id="a1title"></h3><p id="a1q" class="lead"></p><div class="choices" id="a1choices"></div><div class="feedback" id="a1feedback"></div></div>

<div class="activity locked" id="act2"><div class="eyebrow">Actividad independiente 2</div><h3>Construye desde el enunciado</h3><div class="statement" id="statement"></div><p class="lead">Arrastra cada elemento al cuadro correcto.</p>
<div class="tokens" id="unused"></div><div class="slots"><div class="drop" data-k="E" id="E"><b>▭ Entidades</b></div><div class="drop" data-k="A" id="A"><b>⬭ Atributos</b></div><div class="drop" data-k="R" id="R"><b>◇ Relaciones</b></div></div>
<div class="controls"><button id="check">Comprobar actividad 2</button></div><div class="feedback" id="buildFeedback"></div></div>

<div class="progress"><div class="bar" id="bar"></div></div>
<div class="controls"><button id="prev">← Anterior</button><button id="next" disabled>Siguiente pregunta →</button></div>
</main>
<script>
const $=id=>document.getElementById(id);
const levels=[
{t:"1. Reconoce una entidad",d:"Observa el diagrama. Una entidad representa algo del mundo real sobre lo que queremos guardar información.",q:"¿Qué figura representa la entidad CLIENTE?",c:["Rectángulo","Óvalo","Rombo"],a:0,extra:["¿Cuál podría ser otra entidad en un sistema de ventas?",["Precio","PRODUCTO","Nombre"],1],stmt:"Una tienda registra CLIENTES que realizan PEDIDOS. Del cliente guarda nombre y correo; del pedido, fecha y total.",items:{CLIENTE:"E",PEDIDO:"E",Nombre:"A",Correo:"A",Fecha:"A",Total:"A",REALIZA:"R"},nodes:[["r",400,140,180,65,"CLIENTE"]]},
{t:"2. Identifica atributos",d:"Los atributos describen características de una entidad y se representan mediante óvalos.",q:"¿Cuál es un atributo de CLIENTE?",c:["COMPRA","Correo","CLIENTE"],a:1,extra:["¿Qué figura se utiliza para un atributo?",["Rombo","Rectángulo","Óvalo"],2],stmt:"Una biblioteca registra LIBROS escritos por AUTORES. De cada libro guarda título e ISBN; del autor guarda nombre.",items:{LIBRO:"E",AUTOR:"E",Título:"A",ISBN:"A","Nombre autor":"A",ESCRIBE:"R"},nodes:[["r",400,160,170,60,"CLIENTE"],["e",250,65,150,55,"Nombre"],["e",550,65,150,55,"Correo"]],lines:[[350,135,285,90],[450,135,515,90]]},
{t:"3. Varias entidades",d:"Un modelo puede contener varias entidades, cada una con sus propios atributos.",q:"¿Cuál elemento debería modelarse como entidad?",c:["Fecha","Total","PEDIDO"],a:2,extra:["En una escuela, ¿cuál sería normalmente una entidad?",["ESTUDIANTE","Edad","Código"],0],stmt:"Una escuela registra ESTUDIANTES que se matriculan en CURSOS. Del estudiante guarda código y nombre; del curso, nombre y créditos.",items:{ESTUDIANTE:"E",CURSO:"E","Código estudiante":"A","Nombre estudiante":"A","Nombre curso":"A",Créditos:"A",MATRICULA:"R"},nodes:[["r",220,145,170,60,"CLIENTE"],["r",580,145,170,60,"PEDIDO"]]},
{t:"4. Reconoce relaciones",d:"Las relaciones conectan entidades y en la notación clásica se representan mediante rombos.",q:"¿Qué representa REALIZA?",c:["Atributo","Relación","Entidad"],a:1,extra:["¿Qué palabra suele indicar una relación?",["Un verbo","Un número","Un color"],0],stmt:"Una clínica registra MÉDICOS que ATIENDEN PACIENTES. Del médico guarda especialidad; del paciente, documento y nombre.",items:{MÉDICO:"E",PACIENTE:"E",Especialidad:"A",Documento:"A",Nombre:"A",ATIENDE:"R"},nodes:[["r",160,140,150,60,"CLIENTE"],["d",400,140,110,60,"REALIZA"],["r",640,140,150,60,"PEDIDO"]],lines:[[235,140,345,140],[455,140,565,140]]},
{t:"5. Lee un modelo completo",d:"Combina entidades, atributos y relaciones para interpretar el significado del modelo.",q:"¿Cuál lectura es correcta?",c:["CLIENTE realiza PEDIDO","Correo realiza Fecha","PEDIDO es atributo"],a:0,extra:["¿Qué describen los óvalos conectados a una entidad?",["Sus atributos","Sus colores","Sus relaciones únicamente"],0],stmt:"Una universidad registra PROFESORES que IMPARTEN ASIGNATURAS. Del profesor guarda identificación y nombre; de la asignatura, código y créditos.",items:{PROFESOR:"E",ASIGNATURA:"E",Identificación:"A",Nombre:"A",Código:"A",Créditos:"A",IMPARTE:"R"},nodes:[["r",150,155,145,55,"CLIENTE"],["d",400,155,105,55,"REALIZA"],["r",650,155,145,55,"PEDIDO"],["e",150,55,130,45,"Correo"],["e",650,55,130,45,"Fecha"]],lines:[[222,155,347,155],[453,155,578,155],[150,127,150,78],[650,127,650,78]]}
];
let i=0,score=0,mainDone=false,a1Done=false,a2Done=false,placement={};
function diagram(L){let z=(L.lines||[]).map(x=>`<line class="line" x1="${x[0]}" y1="${x[1]}" x2="${x[2]}" y2="${x[3]}"/>`).join("");for(const n of L.nodes){let[t,x,y,w,h,label]=n;if(t==="r")z+=`<rect class="entity" x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="8"/><text x="${x}" y="${y}">${label}</text>`;if(t==="e")z+=`<ellipse class="attr" cx="${x}" cy="${y}" rx="${w/2}" ry="${h/2}"/><text x="${x}" y="${y}">${label}</text>`;if(t==="d")z+=`<polygon class="rel" points="${x},${y-h/2} ${x+w/2},${y} ${x},${y+h/2} ${x-w/2},${y}"/><text x="${x}" y="${y}">${label}</text>`}return z}
function token(name){let e=document.createElement("span");e.className="token";e.textContent=name;e.draggable=true;e.dataset.n=name;e.ondragstart=x=>x.dataTransfer.setData("text",name);e.onclick=()=>{let o=["U","E","A","R"],k=o[(o.indexOf(placement[name])+1)%4];placement[name]=k;(k==="U"?$("unused"):$(k)).appendChild(e)};return e}
function setupDrops(){document.querySelectorAll(".drop").forEach(z=>{z.ondragover=e=>{e.preventDefault();z.classList.add("over")};z.ondragleave=()=>z.classList.remove("over");z.ondrop=e=>{e.preventDefault();z.classList.remove("over");let n=e.dataTransfer.getData("text"),el=[...document.querySelectorAll(".token")].find(x=>x.dataset.n===n);if(el){placement[n]=z.dataset.k;z.appendChild(el)}}})}
function render(){let L=levels[i];mainDone=a1Done=a2Done=false;$("level").textContent=`Pregunta principal ${i+1} de ${levels.length}`;$("title").textContent=L.t;$("desc").textContent=L.d;$("mainQ").textContent=L.q;$("board").innerHTML=diagram(L);$("mainFeedback").textContent="";$("mainChoices").innerHTML=L.c.map((x,j)=>`<button class="choice" onclick="mainAns(${j},this)">${x}</button>`).join("");
$("act1").classList.add("locked");$("act2").classList.add("locked");$("a1title").textContent=`Refuerzo de la pregunta ${i+1}`;$("a1q").textContent=L.extra[0];$("a1feedback").textContent="";$("a1choices").innerHTML=L.extra[1].map((x,j)=>`<button class="choice" onclick="a1Ans(${j},this)">${x}</button>`).join("");
$("statement").textContent=L.stmt;$("buildFeedback").textContent="";placement={};$("unused").innerHTML="<b>Elementos sin clasificar:</b> ";["E","A","R"].forEach(k=>$(k).innerHTML=`<b>${k==="E"?"▭ Entidades":k==="A"?"⬭ Atributos":"◇ Relaciones"}</b>`);Object.keys(L.items).forEach(n=>{placement[n]="U";$("unused").appendChild(token(n))});setupDrops();$("next").disabled=true;$("prev").disabled=i===0;$("bar").style.width=(i/levels.length*100)+"%"}
window.mainAns=(j,b)=>{if(mainDone)return;if(j===levels[i].a){mainDone=true;b.classList.add("ok");$("mainFeedback").innerHTML='<span class="success">¡Correcto! Ahora realiza las dos actividades independientes de esta pregunta.</span>';$("act1").classList.remove("locked");$("act2").classList.remove("locked");score+=20;$("score").textContent=score}else{b.classList.add("bad");$("mainFeedback").innerHTML='<span class="error">Inténtalo nuevamente.</span>';setTimeout(()=>b.classList.remove("bad"),600)}}
window.a1Ans=(j,b)=>{if(a1Done)return;if(j===levels[i].extra[2]){a1Done=true;b.classList.add("ok");$("a1feedback").innerHTML='<span class="success">¡Actividad 1 completada!</span>';score+=10;$("score").textContent=score;ready()}else{b.classList.add("bad");$("a1feedback").innerHTML='<span class="error">Revisa el concepto e intenta otra vez.</span>';setTimeout(()=>b.classList.remove("bad"),600)}}
$("check").onclick=()=>{if(!mainDone||a2Done)return;let L=levels[i],wrong=Object.keys(L.items).filter(n=>placement[n]!==L.items[n]);if(!wrong.length){a2Done=true;$("buildFeedback").innerHTML='<span class="success">¡Actividad 2 completada! El modelo está bien clasificado.</span>';score+=20;$("score").textContent=score;ready()}else $("buildFeedback").innerHTML=`<span class="error">Hay ${wrong.length} elemento(s) por corregir.</span>`}
function ready(){if(mainDone&&a1Done&&a2Done){$("next").disabled=false;$("bar").style.width=((i+1)/levels.length*100)+"%"}}
$("next").onclick=()=>{if(i<levels.length-1){i++;render()}else{alert("¡Excelente! Completaste todas las preguntas y sus actividades.");$("next").disabled=true}}
$("prev").onclick=()=>{if(i>0){i--;render()}};render();
</script></body></html>
